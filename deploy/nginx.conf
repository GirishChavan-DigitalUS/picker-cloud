# Picker — Nginx reverse proxy + static file server
# Install to: /etc/nginx/conf.d/picker.conf
#
# NOTE: This is the HTTP-only bootstrap config.
# After running setup-ssl.sh, this is replaced by nginx-https.conf (HTTPS).

# ── Rate limiting (DDoS-lite protection) ─────────────────────────────────────
# 30 req/s per client IP, burst 60. Tracked in a 10 MB shared zone.
limit_req_zone $binary_remote_addr zone=picker_rl:10m rate=30r/s;

server {
    listen 80 default_server;
    server_name nysepicker.duckdns.org;

    # Allow Let's Encrypt ACME challenge (used by setup-ssl.sh)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Frontend static files
    root /opt/picker/frontend/dist;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 256;

    # ── Rate limit (still applied site-wide) ──────────────────────────────
    limit_req            zone=picker_rl burst=60 nodelay;

    # Authentication is enforced by the FastAPI backend via a signed session
    # cookie issued by POST /api/auth/login. Static assets (incl. the SPA's
    # index.html) are served unauthenticated so the React <AuthGate> can load
    # and render the login form.

    # ── PUBLIC: root → landing page (no auth) ────────────────────────────────
    location = / {
        return 302 /landing.html;
    }

    # ── PUBLIC: landing page (the dashboard's "About") ───────────────────────
    location = /landing.html {
        try_files $uri =404;
    }

    # ── PROTECTED: dashboard entry point — React AuthGate shows login form ───
    # CTAs on landing.html point here. Auth is enforced inside FastAPI.
    location = /app {
        try_files /index.html =404;
    }

    # ── PUBLIC: architecture page ────────────────────────────────────────────
    location = /architecture.html {
        try_files $uri =404;
    }

    # ── PUBLIC: API health check (for monitoring / uptime probes) ────────────
    location = /api/health {
        proxy_pass         http://127.0.0.1:8000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # API proxy (auth enforced by FastAPI — see backend/auth.py)
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts for long-polling endpoints
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # WebSocket proxy (auth enforced by FastAPI — see backend/auth.py)
    location /ws {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # WebSocket timeout — keep alive for up to 1 hour
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # SPA fallback — serve index.html for client-side routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Security headers ─────────────────────────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
}
