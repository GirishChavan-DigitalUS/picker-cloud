# Picker — Nginx HTTPS config
# Deployed by setup-ssl.sh once the Let's Encrypt certificate is obtained.
# Install to: /etc/nginx/conf.d/picker.conf

# ── Rate limiting (DDoS-lite protection) ─────────────────────────────────────
# 30 req/s per client IP, burst 60. Tracked in a 10 MB shared zone (~160k IPs).
limit_req_zone $binary_remote_addr zone=picker_rl:10m rate=30r/s;

# ── HTTP: redirect to HTTPS + allow ACME renewal ─────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name nysepicker.duckdns.org;

    # Let's Encrypt renewal challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect everything else to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS ─────────────────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name nysepicker.duckdns.org;

    ssl_certificate     /etc/letsencrypt/live/nysepicker.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nysepicker.duckdns.org/privkey.pem;

    # Modern TLS settings
    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache         shared:SSL:10m;
    ssl_session_timeout       1d;
    ssl_session_tickets       off;

    # HSTS — tell browsers to always use HTTPS
    add_header Strict-Transport-Security "max-age=63072000" always;

    # Frontend static files
    root  /opt/picker/frontend/dist;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 256;

    # ── Rate limit (still applied site-wide) ──────────────────────────────
    limit_req            zone=picker_rl burst=60 nodelay;

    # Authentication is enforced by the FastAPI backend via a signed session
    # cookie issued by POST /api/auth/login. Static assets (incl. the SPA's
    # index.html) are served unauthenticated so the React <AuthGate> can load
    # and render the login form.

    # ── PUBLIC: root → landing page (no auth) ────────────────────────────────
    location = / {
        return 302 /landing.html;
    }

    # ── PUBLIC: landing page (the dashboard's "About") ───────────────────────
    location = /landing.html {
        try_files $uri =404;
    }

    # ── PROTECTED: dashboard entry point — React AuthGate shows login form ───
    # CTAs on landing.html point here. Auth is enforced inside FastAPI.
    location = /app {
        try_files /index.html =404;
    }

    # ── PUBLIC: architecture page ────────────────────────────────────────────
    location = /architecture.html {
        try_files $uri =404;
    }

    # ── PUBLIC: API health check (for monitoring / uptime probes) ────────────
    location = /api/health {
        proxy_pass         http://127.0.0.1:8000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # API proxy (auth enforced by FastAPI — see backend/auth.py)
    location /api/ {
        proxy_pass         http://127.0.0.1:8000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # WebSocket proxy (auth enforced by FastAPI — see backend/auth.py)
    location /ws {
        proxy_pass          http://127.0.0.1:8000;
        proxy_http_version  1.1;
        proxy_set_header    Upgrade    $http_upgrade;
        proxy_set_header    Connection "upgrade";
        proxy_set_header    Host       $host;
        proxy_set_header    X-Real-IP  $remote_addr;
        proxy_set_header    X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
    }

    # SPA fallback — serve index.html for client-side routes.
    # On first load the React <AuthGate> probes /api/auth/me and either
    # renders the dashboard or shows the login form.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
}
